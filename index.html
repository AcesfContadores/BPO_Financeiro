<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Painéis ACESF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Jost:wght@500;600&display=swap">
<style>
/* Tokens do padrão visual ACESF · Painel Grupo Prontomed
   Marca fixa: navy #1F3A6E, azul #5B9BD5, dourado #C9A96E, Montserrat.
   Cada linha de negócio mantém a MESMA cor em todas as telas. */

:root {
  color-scheme: light;
  --navy: #1F3A6E;
  --navy-barra: #1F3A6E;
  --azul: #5B9BD5;
  --dourado: #C9A96E;

  /* empresas */
  --emp-prontomed: #5B9BD5;
  --emp-multidisciplinar: #2BB39A;
  --emp-grupo: #C9A96E;
  --emp-iguatu: #3F6FC4;
  --emp-ico: #E07A5F;
  --emp-cajazeiras: #2BB39A;
  --emp-cd: #8E7CC3;
  --emp-sem_centro: #98A4B3;

  /* linhas de receita — Prontomed */
  --lin-lab: #1F3A6E; --lin-cons: #2BB39A; --lin-img: #C9A96E; --lin-cardio: #8E7CC3; --lin-acess: #B8C2CC;
  --lab-part: #1F3A6E; --lab-conv: #E07A5F; --lab-emp: #2BB39A;
  /* linhas de receita — Multidisciplinar */
  --mu-conv: #1F3A6E; --mu-multi: #2BB39A; --mu-atend-part: #5B9BD5; --mu-outras: #B8C2CC;
  /* especialidades */
  --esp-psico: #1F3A6E; --esp-psicoped: #2BB39A; --esp-to: #5B9BD5; --esp-fisio: #C9A96E;
  --esp-fono: #8FA3BF; --esp-nutri: #E07A5F; --esp-outros: #B8C2CC;

  /* rampa sequencial (magnitude de custos e despesas): escuro = maior */
  --seq-1: #1F3A6E; --seq-2: #4A69A0; --seq-3: #7C95C4; --seq-4: #A9BADA; --seq-5: #D3DCEC;

  /* categorias: grupos de custo/despesa, composições e roscas (cores bem distintas, ordem fixa) */
  --cat-1: #3F7FD0; --cat-2: #C9A96E; --cat-3: #4FA84A; --cat-4: #F08A24; --cat-5: #D9473F; --cat-6: #8E7CC3; --cat-outras: #B8C2CC;

  /* semântica (estado, nunca identidade) */
  --bom: #1F9D6B; --ruim: #D64545; --atencao: #E0A82E; --neutro: #8A94A6;
  --bom-fundo: #E7F5EF; --ruim-fundo: #FBEAEA; --atencao-fundo: #FFF6E0; --atencao-texto: #8A4B00;

  /* superfícies e texto */
  --pagina: #F5F7FA;
  --painel: #FFFFFF;
  --painel-2: #F4F6FA;
  --borda: #E3E8F0;
  --grade: #E9EDF3;
  --subtotal: #EAF0F8;
  --texto: #1A2238;
  --texto-2: #4C5873;
  --texto-3: #7A859C;
  --trilho: #E3E8F0;
  --sombra: 0 1px 2px rgba(31, 58, 110, .06), 0 4px 16px rgba(31, 58, 110, .05);

  --raio: 10px;
  --fonte: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* Tema escuro: passos próprios (não é inversão automática). A navy da marca some no fundo escuro,
   então as linhas que usam navy sobem para um azul mais claro, mantendo a identidade. */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    color-scheme: dark;
    --seq-1: #A9C3F2; --seq-2: #7F9EDB; --seq-3: #5F7DB9; --seq-4: #455F94; --seq-5: #324673;
    --navy-barra: #7FA2E8; --lin-cons: #3CC3A8; --lin-lab: #7FA2E8; --lab-part: #7FA2E8; --lab-conv: #F0907A; --lab-emp: #3CC3A8;
    --mu-conv: #7FA2E8; --esp-psico: #7FA2E8;
    --cat-1: #7FA2E8; --cat-2: #D9B97C; --cat-3: #7CCB72; --cat-4: #F5A25A; --cat-5: #F0767A; --cat-6: #A99BDB; --cat-outras: #7E8AA3;
    --bom: #3CC38F; --ruim: #F0706F; --atencao: #E8B54A; --neutro: #98A2B6;
    --bom-fundo: #12342A; --ruim-fundo: #3A1A1D; --atencao-fundo: #3A2E12; --atencao-texto: #F2C77A;
    --pagina: #0E1526; --painel: #151E34; --painel-2: #1B2641; --borda: #26324F; --grade: #212C48;
    --subtotal: #1D2A4A; --texto: #E8ECF6; --texto-2: #B5BED3; --texto-3: #8591AB; --trilho: #26324F;
    --sombra: 0 1px 2px rgba(0, 0, 0, .4);
  }
}
:root[data-tema="escuro"] {
  color-scheme: dark;
  --seq-1: #A9C3F2; --seq-2: #7F9EDB; --seq-3: #5F7DB9; --seq-4: #455F94; --seq-5: #324673;
  --navy-barra: #7FA2E8; --lin-cons: #3CC3A8; --lin-lab: #7FA2E8; --lab-part: #7FA2E8; --lab-conv: #F0907A; --lab-emp: #3CC3A8;
  --mu-conv: #7FA2E8; --esp-psico: #7FA2E8;
  --cat-1: #7FA2E8; --cat-2: #D9B97C; --cat-3: #7CCB72; --cat-4: #F5A25A; --cat-5: #F0767A; --cat-6: #A99BDB; --cat-outras: #7E8AA3;
  --bom: #3CC38F; --ruim: #F0706F; --atencao: #E8B54A; --neutro: #98A2B6;
  --bom-fundo: #12342A; --ruim-fundo: #3A1A1D; --atencao-fundo: #3A2E12; --atencao-texto: #F2C77A;
  --pagina: #0E1526; --painel: #151E34; --painel-2: #1B2641; --borda: #26324F; --grade: #212C48;
  --subtotal: #1D2A4A; --texto: #E8ECF6; --texto-2: #B5BED3; --texto-3: #8591AB; --trilho: #26324F;
  --sombra: 0 1px 2px rgba(0, 0, 0, .4);
}

[data-empresa="prontomed"] { --emp: var(--emp-prontomed); }
[data-empresa="multidisciplinar"] { --emp: var(--emp-multidisciplinar); }
[data-empresa="grupo"] { --emp: var(--emp-grupo); }

html, body { margin: 0; font-family: var(--fonte); color: var(--texto); background: var(--pagina); }

[data-empresa="iguatu"] { --emp: var(--emp-iguatu); }
[data-empresa="ico"] { --emp: var(--emp-ico); }
[data-empresa="cajazeiras"] { --emp: var(--emp-cajazeiras); }
[data-empresa="cd"] { --emp: var(--emp-cd); }
[data-empresa="sem_centro"] { --emp: var(--emp-sem_centro); }

/* Painel Prontomed · layout de dashboard (rolagem contínua, menu lateral, filtros fixos, gaveta de detalhe) */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums; }
h1, h2, h3, p { margin: 0; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; border-radius: 4px; }
.dim { color: var(--texto-3); }
.pular { position: absolute; left: -999px; top: 8px; background: var(--navy); color: #fff; padding: 8px 12px; border-radius: 8px; z-index: 100; }
.pular:focus { left: 8px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.carregando { padding: 48px 24px; color: var(--texto-2); text-align: center; }

/* ─── casca ─── */
.casca { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.lateral { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 20px; padding: 20px 14px; background: var(--navy); color: #fff; }
.marca-app { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.marca-sel { width: 34px; height: 34px; border-radius: 9px; background: var(--dourado); color: var(--navy); display: grid; place-items: center; font-weight: 800; font-size: 17px; }
.marca-app strong { display: block; font-size: 14px; font-weight: 700; }
.marca-app small { color: #B9C6E0; font-size: 11px; }
.menu { display: flex; flex-direction: column; gap: 2px; }
.menu a { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; color: #D5DEF1; text-decoration: none; font-weight: 500; }
.menu a:hover { background: rgba(255, 255, 255, .08); }
.menu a.on { background: rgba(255, 255, 255, .14); color: #fff; font-weight: 700; box-shadow: inset 3px 0 0 var(--emp, var(--dourado)); }
.carimbo { margin-top: auto; font-size: 11px; padding: 0 6px; color: #9FB0D2; }
.centro { min-width: 0; }
.barra { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end; justify-content: space-between; padding: 14px 28px 12px; background: color-mix(in srgb, var(--pagina) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--borda); }
.barra h1 { font-size: 21px; font-weight: 800; color: var(--navy-barra); letter-spacing: -.01em; }
.sub { color: var(--texto-3); font-size: 12.5px; margin-top: 1px; }
.filtros { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; }
.campo { display: grid; gap: 2px; font-size: 11px; color: var(--texto-3); font-weight: 600; }
.campo select { padding: 7px 28px 7px 10px; border: 1px solid var(--borda); border-radius: 8px; background: var(--painel); color: var(--texto); font-weight: 500; font-size: 13px; min-height: 36px; }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--borda); background: var(--painel); border-radius: 10px; gap: 2px; }
.seg button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; padding: 6px 11px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--texto-2); min-height: 30px; }
.seg button i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.seg button.on { background: var(--navy); color: #fff; }
.btn { border: 1px solid var(--borda); background: var(--painel); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 13px; min-height: 36px; }
.btn:hover { background: var(--painel-2); }
.btn.primario { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.icone { width: 36px; padding: 0; font-size: 16px; }
main { padding: 22px 28px 64px; display: grid; gap: 22px; max-width: 1560px; }
main[aria-busy="true"] { opacity: .5; }

/* ─── seções e grades ─── */
.secao { background: var(--painel); border: 1px solid var(--borda); border-radius: var(--raio); padding: 18px 20px 16px; box-shadow: var(--sombra); min-width: 0; display: grid; gap: 12px; align-content: start; }
.secao-cab h2 { font-size: 15px; font-weight: 700; color: var(--texto); }
.secao-cab p { color: var(--texto-3); font-size: 12.5px; margin-top: 2px; max-width: 78ch; }
.duas { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 22px; }
.duas.igual { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grafico { width: 100%; min-height: 40px; }
.grafico svg { display: block; overflow: visible; }
.vazio { color: var(--texto-3); padding: 18px 4px; }
.vazio.erro { color: var(--ruim); }
.marca { outline-offset: 1px; }
.marca:hover { filter: brightness(1.08); }

/* ─── destaque e KPIs ─── */
.faixa-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 22px; align-items: stretch; }
.hero { background: var(--navy); color: #fff; border-radius: var(--raio); padding: 22px 24px; display: grid; gap: 8px; align-content: start; box-shadow: var(--sombra); }
[data-empresa="prontomed"] .hero { background: linear-gradient(135deg, var(--navy), #2F5C93); }
.hero-r { font-size: 12.5px; color: #C7D4EE; font-weight: 600; }
.hero-v { font-size: clamp(30px, 4.4vw, 44px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.hero-d { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: #C7D4EE; font-size: 12.5px; }
.hero-t { font-size: 14px; color: #E8EEFB; max-width: 58ch; }
.hero-sp { display: flex; gap: 10px; align-items: center; color: #B9C6E0; font-size: 12px; }
.hero-sp svg path { stroke: #fff; }
.hero-sp svg circle { fill: #fff; stroke: var(--navy); }
.hero-aj { font-size: 12.5px; color: #E8EEFB; border-top: 1px solid rgba(255, 255, 255, .18); padding-top: 8px; }
.hero .dim { color: #B9C6E0; }
.hero .delta { background: rgba(255, 255, 255, .14); color: #fff; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tiles.quatro { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tile { text-align: left; display: grid; gap: 4px; align-content: start; background: var(--painel); border: 1px solid var(--borda); border-radius: var(--raio); padding: 14px 16px; box-shadow: var(--sombra); border-top: 3px solid var(--emp, var(--dourado)); min-width: 0; }
button.tile:hover { background: var(--painel-2); }
.tile-r { font-size: 12px; color: var(--texto-3); font-weight: 600; }
.tile-v { font-size: 22px; font-weight: 800; color: var(--texto); letter-spacing: -.01em; overflow-wrap: anywhere; }
.tile-s, .tile-b { font-size: 12px; color: var(--texto-3); }
.tile-d { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.tile-sp { margin-top: 2px; }
.tile-sp svg { display: block; max-width: 100%; }
.tile-sp path { vector-effect: non-scaling-stroke; }

.delta { display: inline-flex; gap: 4px; align-items: center; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.delta-i { font-size: 9px; }
.delta.bom { color: var(--bom); background: var(--bom-fundo); }
.delta.ruim { color: var(--ruim); background: var(--ruim-fundo); }
.delta.neutro { color: var(--texto-2); background: var(--painel-2); }

/* ─── legenda ─── */
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.leg-item { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; padding: 4px 2px; font-size: 12.5px; color: var(--texto-2); font-weight: 500; }
.leg-item.off { opacity: .45; text-decoration: line-through; }
.leg-k { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.legenda.estatica { margin-bottom: 2px; }

/* ─── alertas ─── */
.atencao { display: grid; gap: 10px; }
.alerta { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 11px 12px; border-radius: 9px; background: var(--painel-2); border-left: 4px solid var(--neutro); }
.alerta.atencao { background: var(--atencao-fundo); border-left-color: var(--atencao); }
.alerta.ruim { background: var(--ruim-fundo); border-left-color: var(--ruim); }
.alerta.info { border-left-color: var(--azul); }
.alerta-i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--painel); font-size: 11px; font-weight: 800; }
.alerta h3 { font-size: 13px; font-weight: 700; }
.alerta p { font-size: 12.5px; color: var(--texto-2); margin-top: 2px; }
.lnk-acao { margin-top: 6px; border: 0; background: none; padding: 0; color: var(--navy-barra); font-weight: 700; font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; }

/* ─── tabelas ─── */
.tabela-rolagem { overflow-x: auto; border-radius: 8px; }
table.dre { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 760px; }
table.dre.mini { min-width: 0; font-size: 12.5px; }
.dre th { text-align: right; font-weight: 700; font-size: 12px; color: var(--texto-3); padding: 8px 10px; border-bottom: 1px solid var(--borda); white-space: nowrap; position: sticky; top: 0; background: var(--painel); }
.dre th.atual { color: var(--texto); box-shadow: inset 0 -2px 0 var(--emp, var(--dourado)); }
.dre th.c-nome, .dre td.c-nome { text-align: left; }
.dre td { padding: 7px 10px; border-bottom: 1px solid var(--grade); text-align: right; white-space: nowrap; }
.dre td.atual { background: color-mix(in srgb, var(--emp, var(--dourado)) 7%, var(--painel)); font-weight: 600; }
.dre td.c-nome { white-space: normal; min-width: 210px; position: sticky; left: 0; background: var(--painel); z-index: 1; }
.dre td.c-tend { width: 96px; padding: 2px 10px; text-align: left; }
.dre tr.grupo td { background: var(--subtotal); font-weight: 700; }
.dre tr.grupo td.c-nome { background: var(--subtotal); }
.dre tr.total td { font-weight: 700; border-top: 1px solid var(--borda); }
.dre tr.total.forte td { background: var(--subtotal); }
.dre tr.total.forte td.c-nome { background: var(--subtotal); }
.dre tr.pai > td.c-nome button.lnk { font-weight: 600; }
.dre tr.destacada td { background: var(--atencao-fundo); }
.dre .calor { font-weight: 600; }
.chev { width: 20px; height: 20px; border: 0; background: none; color: var(--texto-3); display: inline-grid; place-items: center; font-size: 11px; vertical-align: middle; transition: transform .12s; padding: 0; }
.chev.aberto { transform: rotate(90deg); }
.chev.vazio { visibility: hidden; }
button.lnk { border: 0; background: none; padding: 2px 0; text-align: left; color: var(--texto); font-weight: 500; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
button.lnk:hover { color: var(--navy-barra); text-decoration-color: currentColor; }
.fontes { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.fonte { padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 600; background: var(--painel-2); color: var(--texto-2); border: 1px solid var(--borda); }
.fonte.f-Nibo { border-color: var(--azul); } .fonte.f-manual { border-color: var(--dourado); }
.chip-emp { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; }
.chip-emp i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.origem { background: var(--painel); border: 1px solid var(--borda); border-radius: var(--raio); padding: 14px 18px; display: grid; gap: 4px; }

/* ─── simuladores ─── */
.sim { display: grid; gap: 16px; }
.sim-ctrl, .sim-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 22px; align-items: end; }
.sim-c, .sim-n { display: grid; gap: 4px; }
.sim-r { font-size: 12.5px; font-weight: 600; }
.sim-c input[type=range] { width: 100%; accent-color: var(--navy-barra); }
.sim-v { font-weight: 800; font-size: 15px; }
.sim-in { display: flex; align-items: center; gap: 6px; }
.sim-in input { width: 100%; padding: 7px 10px; border: 1px solid var(--borda); border-radius: 8px; background: var(--painel); min-height: 36px; font-weight: 600; }
.sim-in em { font-style: normal; color: var(--texto-3); font-size: 12px; }
.sim-res { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.sim-b { display: grid; gap: 4px; padding: 12px 14px; background: var(--painel-2); border-radius: 9px; align-content: start; justify-items: start; }
.sim-b .tile-v { font-size: 19px; }
.sim > .btn { justify-self: start; }

/* ─── gaveta "Destrinchar" ─── */
.cortina { position: fixed; inset: 0; background: rgba(14, 21, 38, .36); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 40; }
.cortina.on { opacity: 1; pointer-events: auto; }
.gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--painel); border-left: 1px solid var(--borda); box-shadow: -12px 0 40px rgba(14, 21, 38, .18); transform: translateX(104%); transition: transform .22s ease; z-index: 50; overflow-y: auto; visibility: hidden; }
.gaveta.aberta { transform: none; visibility: visible; }
.drawer-corpo { padding: 20px 22px 40px; display: grid; gap: 14px; }
.dw-topo { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.dw-topo h2 { font-size: 20px; font-weight: 800; color: var(--navy-barra); }
.dw-trilha { font-size: 12px; color: var(--texto-3); margin-bottom: 2px; }
.fechar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--borda); background: var(--painel); font-size: 22px; line-height: 1; flex: none; }
.dw-hero { display: grid; gap: 4px; padding: 14px 16px; background: var(--painel-2); border-radius: var(--raio); }
.dw-valor { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.dw-metas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 0; }
.dw-metas dt { font-size: 11.5px; color: var(--texto-3); font-weight: 600; }
.dw-metas dd { margin: 1px 0 0; font-weight: 700; }

// Casca única: tela de login, abertura dos dados (criptografados) e menu lateral por empresa.
// Os dados de cada empresa só existem em claro depois que a senha certa abre a chave dela.
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "style") for (const [a, b] of Object.entries(v)) e.style.setProperty(a, b);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const svg = (d) => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", width: 20, height: 20, fill: "none", stroke: "currentColor", "stroke-width": 1.8, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) s.setAttribute(k, v);
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", d); s.append(p); return s;
};
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const enc = new TextEncoder(), dec = new TextDecoder();

async function chaveDaSenha(usuario, senha, saltB64) {
  const base = await crypto.subtle.importKey("raw", enc.encode(`${usuario.trim().toLowerCase()}\u0000${senha}`), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(saltB64), iterations: ACESS.iteracoes, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function abrir(papel, usuario, senha) {
  const conta = ACESS.contas.find((c) => c.papel === papel);
  if (!conta) throw new Error("conta");
  const kek = await chaveDaSenha(usuario, senha, conta.salt);
  const dados = {};
  for (const [ds, w] of Object.entries(conta.chaves)) {
    const bruta = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(w.iv) }, kek, b64(w.ct)); // falha aqui = senha errada
    const k = await crypto.subtle.importKey("raw", bruta, "AES-GCM", false, ["decrypt"]);
    const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ACESS.dados[ds].iv) }, k, b64(ACESS.dados[ds].ct));
    dados[ds] = JSON.parse(dec.decode(claro));
  }
  return { papel, usuario: conta.usuario, dados, admin: papel === "admin" };
}

const EMPRESAS = {
  prontomed: { id: "prontomed", nome: "Prontomed", completo: "Clínica Prontomed e Multidisciplinar", cor: "var(--emp-prontomed)", modulo: () => Prontomed },
  imunne: { id: "imunne", nome: "IMUNNE", completo: "Iguatu, Icó, Cajazeiras e CD de vacinas", cor: "var(--emp-iguatu)", modulo: () => Imunne },
};

const raiz = document.getElementById("acesf");
let tentativas = 0, bloqueadoAte = 0;

// ───────────────────────── login ─────────────────────────
function telaLogin() {
  raiz.replaceChildren();
  let escolha = null;
  const aviso = h("p", { class: "lg-erro", role: "alert", "aria-live": "assertive" });
  const usuario = h("input", { id: "lg-usuario", type: "text", autocomplete: "username", autocapitalize: "none", spellcheck: "false", required: true });
  const senha = h("input", { id: "lg-senha", type: "password", autocomplete: "current-password", required: true });
  const ver = h("button", { type: "button", class: "lg-ver", "aria-label": "Mostrar senha", text: "Mostrar", onClick: () => { const m = senha.type === "password"; senha.type = m ? "text" : "password"; ver.textContent = m ? "Ocultar" : "Mostrar"; ver.setAttribute("aria-label", m ? "Ocultar senha" : "Mostrar senha"); } });
  const entrar = h("button", { type: "submit", class: "lg-entrar", text: "Entrar" });
  const cab = h("p", { class: "lg-quem", "aria-live": "polite" });
  const cartoes = h("div", { class: "lg-cartoes", role: "radiogroup", "aria-label": "Empresa" });
  const campos = h("div", { class: "lg-campos", hidden: true },
    cab,
    h("label", { class: "lg-campo", for: "lg-usuario" }, h("span", { text: "Usuário" }), usuario),
    h("label", { class: "lg-campo", for: "lg-senha" }, h("span", { text: "Senha" }), h("span", { class: "lg-senha" }, senha, ver)),
    aviso, entrar);
  const admin = h("button", { type: "button", class: "lg-admin", text: "Entrar como administrador ACESF", onClick: () => escolher("admin") });

  const escolher = (id) => {
    escolha = id; aviso.textContent = ""; campos.hidden = false;
    for (const b of cartoes.children) { const on = b.dataset.id === id; b.setAttribute("aria-checked", String(on)); b.classList.toggle("on", on); }
    admin.classList.toggle("on", id === "admin");
    cab.textContent = id === "admin" ? "Acesso do administrador" : `Acesso ${EMPRESAS[id].nome}`;
    usuario.focus();
  };
  for (const e of Object.values(EMPRESAS))
    cartoes.append(h("button", { type: "button", role: "radio", "aria-checked": "false", class: "lg-cartao", "data-id": e.id, style: { "--c": e.cor }, onClick: () => escolher(e.id) },
      h("i"), h("span", {}, h("strong", { text: e.nome }), h("small", { text: e.completo }))));

  const form = h("form", { class: "lg-form", novalidate: true, onSubmit: async (ev) => {
    ev.preventDefault();
    if (!escolha) { aviso.textContent = "Escolha a empresa para entrar."; return; }
    if (!usuario.value.trim() || !senha.value) { aviso.textContent = "Informe usuário e senha."; return; }
    const agora = Date.now();
    if (agora < bloqueadoAte) { aviso.textContent = `Aguarde ${Math.ceil((bloqueadoAte - agora) / 1000)} s para tentar de novo.`; return; }
    entrar.disabled = true; entrar.textContent = "Abrindo…"; aviso.textContent = "";
    try {
      const sessao = await abrir(escolha, usuario.value, senha.value);
      tentativas = 0; senha.value = "";
      await abrirPainel(sessao);
    } catch (_) {
      tentativas++; bloqueadoAte = Date.now() + Math.min(30, tentativas * tentativas) * 1000 * (tentativas >= 3 ? 1 : 0);
      aviso.textContent = "Usuário ou senha incorretos.";
      senha.value = ""; senha.focus();
    } finally { entrar.disabled = false; entrar.textContent = "Entrar"; }
  } }, h("fieldset", { class: "lg-escolha" }, h("legend", { text: "Qual empresa você quer acessar?" }), cartoes), campos, h("div", { class: "lg-rodape" }, admin));

  raiz.append(h("main", { class: "lg" },
    h("section", { class: "lg-marca" },
      h("img", { class: "lg-logo", src: LOGO, alt: "ACESF Contadores Associados" }),
      h("h1", { text: "Painéis financeiros" }),
      h("p", { class: "lg-nota", text: "Acesso restrito. Cada empresa vê apenas o próprio painel." })),
    h("section", { class: "lg-painel", "aria-labelledby": "lg-titulo" }, h("h2", { id: "lg-titulo", text: "Entrar" }), form)));
}

// ───────────────────────── painel logado ─────────────────────────
const montados = {}; // id -> { host, api, pagina, carimbo }
let sessao = null, ativa = null;
const aberto = new Set();

async function abrirPainel(s) {
  sessao = s;
  const ids = s.admin ? ["prontomed", "imunne"] : [s.papel];
  raiz.replaceChildren();
  const menu = h("nav", { class: "menu", "aria-label": "Empresas e telas" });
  const carimbo = h("p", { class: "carimbo dim" });
  const conteudo = h("div", { class: "centro acesf-centro" });
  const sair = h("button", { type: "button", class: "ac-sair", text: "Sair", onClick: encerrar });
  const eu = h("p", { class: "ac-eu" }, h("small", { text: s.admin ? "Administrador" : "Acesso" }), h("strong", { text: s.admin ? "ACESF" : EMPRESAS[s.papel].nome }));
  raiz.append(h("div", { class: "casca ac-casca" },
    h("header", { class: "lateral" }, h("div", { class: "marca-app" }, h("img", { class: "ac-logo", src: LOGO, alt: "ACESF Contadores Associados" })), menu, h("div", { class: "ac-pe" }, carimbo, eu, sair)),
    conteudo));
  for (const id of ids) {
    const host = h("div", { class: "host", "data-id": id, hidden: true });
    conteudo.append(host);
    montados[id] = { host, api: null, pagina: "resumo", menu: null };
  }
  const desenharMenu = () => {
    menu.replaceChildren();
    for (const id of ids) {
      const e = EMPRESAS[id], m = montados[id];
      const abertoAgora = s.admin ? aberto.has(id) : true;
      const sub = h("div", { class: "sub", id: `sub-${id}`, hidden: !abertoAgora });
      if (m.api) for (const p of m.api.paginas()) {
        const t = m.api.TELAS[p];
        const on = ativa === id && m.pagina === p;
        sub.append(h("a", { href: "#", class: on ? "on" : "", "aria-current": on ? "page" : null, style: { "--emp": e.cor }, onClick: (ev) => { ev.preventDefault(); irPara(id, p); } }, svg(t.icone), h("span", { text: t.nome })));
      }
      const cab = s.admin
        ? h("button", { type: "button", class: "emp-btn" + (ativa === id ? " on" : ""), "aria-expanded": String(abertoAgora), "aria-controls": `sub-${id}`, style: { "--c": e.cor }, onClick: () => { if (ativa === id) { aberto.has(id) ? aberto.delete(id) : aberto.add(id); desenharMenu(); } else irPara(id, null); } },
            h("i"), h("span", { text: e.nome }), h("b", { class: "chev", "aria-hidden": "true", text: "▸" }))
        : h("p", { class: "emp-fixo", style: { "--c": e.cor } }, h("i"), h("span", { text: e.nome }));
      menu.append(h("div", { class: "emp-bloco" + (abertoAgora ? " aberto" : "") }, cab, sub));
    }
  };
  async function irPara(id, pagina) {
    const m = montados[id];
    if (!m.api) {
      m.host.hidden = false; m.host.replaceChildren(h("p", { class: "carregando", text: "Carregando os números…" }));
      m.api = await EMPRESAS[id].modulo().mount(m.host, s.dados[id], { aoMudar: (st) => { m.pagina = st.page; if (ativa === id) { carimbo.textContent = dataBR(m.api?.carimbo()); desenharMenu(); } } });
      if (!m.api) return;
    }
    ativa = id; aberto.clear(); aberto.add(id);
    for (const [k, v] of Object.entries(montados)) v.host.hidden = k !== id;
    if (pagina) m.api.ir(pagina === "comparativo" ? { page: pagina, emp: "grupo", d: null } : { page: pagina, d: null });
    else m.api.redesenhar();
    carimbo.textContent = dataBR(m.api.carimbo());
    window.scrollTo(0, 0);
    desenharMenu();
  }
  desenharMenu();
  await irPara(ids[0], null);
}
const dataBR = (iso) => (iso ? `Dados de ${new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })}` : "");

function encerrar() {
  sessao = null; ativa = null;
  for (const k of Object.keys(montados)) delete montados[k];
  try { location.reload(); return; } catch (_) { /* sem recarregar: volta para o login */ }
  telaLogin();
}

telaLogin();

</script>
</body></html>
